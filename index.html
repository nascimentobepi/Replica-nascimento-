<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0C100B"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Réplica Policial"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="apple-touch-icon.png">
<title>Réplica Policial</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Saira+Stencil+One&display=swap">
<style>
/* Layout: app de uma tela, cabeçalho curto, conteúdo rolável, barra de abas fixa embaixo (polegar no iPhone) e faixa fixa com a pena somada. */
:root{
  --bg:#0C100B; --surface:#141A12; --surface-2:#1D261A; --ink:#E6EBDD; --ink-2:#9BA78F;
  --line:#2A3626; --accent:#93B85E; --accent-ink:#0C100B; --hot:#E4382B; --warn:#E6A93E; --warn-bg:#2A2210;
  --ok:#6CC48A; --bad:#F2796F; color-scheme:dark;
  --stencil:'Saira Stencil One','Barlow Condensed',Impact,sans-serif;
  --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-block:0 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;font-family:var(--display);text-wrap:balance}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:640px;margin:0 auto}
.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:6px;background:var(--surface);margin-top:14px;min-height:156px;display:flex;align-items:center}
.hero .txt{position:relative;z-index:1;padding:16px 14px;max-width:68%}
.hero .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.hero h1{font-family:var(--stencil);font-weight:400;font-size:clamp(23px,7.2vw,32px);line-height:1.04;letter-spacing:.02em;margin:6px 0 8px;text-transform:uppercase}
.hero .sub{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.hero img{position:absolute;right:0;top:0;height:100%;width:58%;object-fit:cover;object-position:50% 25%;-webkit-mask-image:linear-gradient(to right,transparent,#000 55%);mask-image:linear-gradient(to right,transparent,#000 55%)}
.rule{height:4px;background:repeating-linear-gradient(90deg,var(--hot) 0 18px,transparent 18px 26px);margin:10px 0 14px}

.posture{background:var(--warn-bg);color:var(--ink);border:1px solid var(--warn);border-radius:6px;padding:10px 12px;font-size:13.5px;margin-bottom:14px}
.posture b{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);display:block;margin-bottom:2px}

.search{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:11px 12px;margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:500;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;min-width:0}
.card>summary,.card>.head{list-style:none;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;cursor:pointer}
.card>summary::-webkit-details-marker{display:none}
.card .t{font-weight:600;min-width:0}
.card .c{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);display:block;margin-bottom:2px}
.card summary::after{content:"+";font-family:var(--mono);color:var(--accent);font-size:20px;line-height:1;flex:none}
.card[open] summary::after{content:"–"}
.body{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.say{border-left:3px solid var(--line);padding-left:10px;color:var(--ink-2);font-style:italic}
.reply{background:var(--surface-2);border-radius:6px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.reply .ph{background:var(--warn-bg);color:var(--warn);border-radius:3px;padding:0 3px;font-family:var(--mono);font-size:13px}
.lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.base{font-size:13px;color:var(--ink-2);font-weight:400}
.badge{display:inline-block;margin-top:4px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-bg);border-radius:3px;padding:2px 6px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:9px 14px;font-weight:600;font-size:14px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{border-color:var(--bad);background:transparent;color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px;flex:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{color:var(--ink-2);text-align:center;padding:24px 8px}

h2.sec{font-size:22px;letter-spacing:.03em;text-transform:uppercase;margin:6px 0 8px}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-bottom:6px}
.progress i{display:block;height:100%;background:var(--ok);width:0;transition:width .2s}
.phase{margin-bottom:16px}
.check{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
.check:first-child{border-top:0}
.check input{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:var(--accent)}
.check span{min-width:0}
.check small{display:block;color:var(--ink-2);font-size:12.5px}
.check input:checked+span{color:var(--ink-2);text-decoration:line-through}

.sum{background:var(--surface);border:1px solid var(--accent);border-radius:6px;padding:12px 14px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.sum .big{font-family:var(--display);font-weight:700;font-size:36px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.sum .alt{font-size:13px}
.sum .alt b{font-variant-numeric:tabular-nums}
.sum ul{margin:0;padding-left:18px;font-size:13px;color:var(--warn)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tg{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:99px;padding:3px 4px 3px 10px;font-size:12.5px}
.tg button{border:0;background:transparent;color:var(--ink-2);width:22px;height:22px;border-radius:50%;font-size:15px;line-height:1;padding:0}

form.f{display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field input,.field textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.field textarea{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.out{font-family:var(--mono);font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.note{font-size:12.5px;color:var(--ink-2)}
.src{margin-top:18px;font-size:12px;color:var(--ink-2);font-family:var(--mono)}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav button{border:0;background:transparent;border-radius:6px;padding:8px 2px;font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
nav button[aria-current="page"]{background:var(--surface-2);color:var(--accent)}
#pill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:6;border:0;border-radius:99px;background:var(--hot);color:#fff;padding:8px 18px;font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.03em;box-shadow:0 2px 10px rgba(0,0,0,.25);white-space:nowrap;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(116px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:13px;z-index:9;opacity:0;pointer-events:none;transition:opacity .15s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
html{background:var(--bg);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
</style>
</head><body>

/* ---------- Estado ---------- */
var S={tab:load('rp_tab','replicas'),cat:'Todas',q:'',checks:load('rp_checks',{}),extra:load('rp_extra',[]),sel:load('rp_sel',{}),rel:load('rp_rel',{}),del:null,resetAsk:false,open:{}};
if(!S.rel.policial)S.rel.policial='Nascimento Bepi';
var TABS=[['replicas','Réplicas'],['abordagem','Abordagem'],['artigos','Artigos'],['relatorio','Relatório']];
var view=$('#view');
function allArts(){return ARTS.concat(S.extra.map(function(e){return A(e.id,e.art,e.nome,e.min,e.max,e.desc,false)}))}
function fmt(a,b){return (a===b?a:a+'–'+b)+' anos'}

/* soma de pena com as exceções de roubo */
function calc(){
  var sel=allArts().filter(function(a){return S.sel[a.id]});
  var conf=[],drop={};
  sel.forEach(function(a){(EXC[a.id]||[]).forEach(function(o){
    var t=sel.filter(function(x){return x.id===o.id})[0];
    if(t){conf.push({base:a,other:t,n:o.n});drop[t.id]=1}})});
  var sum=function(list){return list.reduce(function(r,a){return {min:r.min+a.min,max:r.max+a.max}},{min:0,max:0})};
  return {sel:sel,conf:conf,all:sum(sel),exc:sum(sel.filter(function(a){return !drop[a.id]}))};
}
function relArtigos(){
  var c=calc();if(!c.sel.length)return '';
  var t=c.sel.map(function(a){return a.art+' '+a.nome}).join('; ');
  return t+' | Pena somada: '+fmt(c.all.min,c.all.max)+(c.conf.length?' ('+fmt(c.exc.min,c.exc.max)+' aplicando exceções de roubo)':'');
}

function renderTabs(){
  $('#tabs').innerHTML=TABS.map(function(t){return '<button data-tab="'+t[0]+'"'+(S.tab===t[0]?' aria-current="page"':'')+'>'+t[1]+'</button>'}).join('');
}
function renderPill(){
  var p=$('#pill'),c=calc();
  if(S.tab==='artigos'&&c.sel.length){p.hidden=false;p.textContent=c.sel.length+' art. · '+fmt(c.all.min,c.all.max)+(c.conf.length?' *':'')}else p.hidden=true;
}
function ph(s){return esc(s).replace(/\[([^\]]+)\]/g,'<span class="ph">[$1]</span>')}

/* ---------- Réplicas ---------- */
function vReplicas(){
  var q=S.q.trim().toLowerCase();
  var items=REPLICAS.map(function(r,i){r.i=i;return r}).filter(function(r){
    return (S.cat==='Todas'||r.cat===S.cat)&&(!q||(r.t+' '+r.say+' '+r.resp).toLowerCase().indexOf(q)>-1)});
  var h='<div class="posture"><b>Postura</b>Calmo, fatos, horários. Responda o que o advogado perguntou, nada além. Preencha os campos [entre colchetes] com o que de fato aconteceu.</div>';
  h+='<input class="search" id="q" type="search" placeholder="Buscar argumento (ex.: drogas, algema, Art. 37)" value="'+esc(S.q)+'">';
  h+='<div class="chips">'+CATS.map(function(c){return '<button class="chip" data-cat="'+c+'" aria-pressed="'+(S.cat===c)+'">'+c+'</button>'}).join('')+'</div>';
  h+='<div class="list">';
  if(!items.length)h+='<div class="empty">Nenhum argumento encontrado.</div>';
  items.forEach(function(r){
    h+='<details class="card" data-i="'+r.i+'"'+(S.open[r.i]?' open':'')+'><summary><span class="t"><span class="c">'+r.cat+'</span>'+esc(r.t)+'</span></summary><div class="body">'+
    '<div><div class="lbl">O advogado diz</div><div class="say">'+esc(r.say)+'</div></div>'+
    '<div><div class="lbl">Sua resposta</div><div class="reply">'+ph(r.resp)+'</div></div>'+
    '<div class="base">'+esc(r.base)+'</div>'+
    '<div class="row"><button class="btn sm" data-copy="'+r.i+'">Copiar resposta</button></div></div></details>';
  });
  return h+'</div><div class="src">Baseado no Código Penal das Regras LEGACY RP (PDF de 01/08/2026). Confira se o texto mudou.</div>';
}

/* ---------- Abordagem ---------- */
function vAbordagem(){
  var total=0,done=0;
  CHECK.forEach(function(p,pi){p.items.forEach(function(_,ii){total++;if(S.checks[pi+'-'+ii])done++})});
  var h='<h2 class="sec">Checklist da ocorrência</h2><div class="progress"><i style="width:'+(done/total*100)+'%"></i></div>'+
   '<div class="note" style="margin-bottom:12px">'+done+' de '+total+' passos feitos</div>';
  CHECK.forEach(function(p,pi){
    h+='<div class="phase"><div class="lbl" style="margin-bottom:6px">'+p.p+'</div><div class="card">';
    p.items.forEach(function(it,ii){var k=pi+'-'+ii;
      h+='<label class="check"><input type="checkbox" data-ck="'+k+'"'+(S.checks[k]?' checked':'')+'><span>'+esc(it[0])+'<small>'+esc(it[1])+'</small></span></label>'});
    h+='</div></div>';
  });
  h+=S.resetAsk?'<div class="row"><button class="btn danger" data-reset="yes">Confirmar: limpar tudo</button><button class="btn ghost" data-reset="no">Cancelar</button></div>':'<button class="btn ghost" data-reset="ask">Nova ocorrência (limpar)</button>';
  return h;
}

/* ---------- Artigos + soma ---------- */
function vArtigos(){
  var q=S.q.trim().toLowerCase(),c=calc();
  var h='<h2 class="sec">Código penal e soma de pena</h2>';
  if(c.sel.length){
    h+='<div class="sum"><div class="lbl">Pena somada · '+c.sel.length+' artigo'+(c.sel.length>1?'s':'')+'</div><div class="big">'+fmt(c.all.min,c.all.max)+'</div>';
    if(c.conf.length){
      h+='<div class="alt">Aplicando as exceções de roubo: <b>'+fmt(c.exc.min,c.exc.max)+'</b></div><ul>'+
        c.conf.map(function(x){return '<li>'+esc(x.other.art)+' não soma com '+esc(x.base.art)+'. '+esc(x.n)+'</li>'}).join('')+'</ul>';
    }
    h+='<div class="tags">'+c.sel.map(function(a){return '<span class="tg">'+esc(a.art)+'<button data-selrm="'+a.id+'" aria-label="Remover '+esc(a.art)+'">×</button></span>'}).join('')+'</div>'+
      '<div class="row"><button class="btn sm" data-toreport="1">Levar ao relatório</button><button class="btn ghost sm" data-selclear="1">Limpar seleção</button></div></div>';
  }else{
    h+='<div class="posture"><b>Como usar</b>Toque em Somar nos crimes cometidos. A pena total aparece aqui e na faixa azul. O código permite somar tudo, menos as exceções de roubo, que o app avisa.</div>';
  }
  h+='<input class="search" id="qa" type="search" placeholder="Buscar artigo ou crime (ex.: drogas, 37, roubo)" value="'+esc(S.q)+'"><div class="list">';
  var any=false;
  allArts().forEach(function(a){
    if(q&&(a.art+' '+a.nome+' '+a.desc).toLowerCase().indexOf(q)<0)return;any=true;
    var on=!!S.sel[a.id],isx=a.id.charAt(0)==='x';
    h+='<div class="card"><div class="head" style="cursor:default"><div class="t"><span class="c">'+esc(a.art)+' · '+fmt(a.min,a.max)+'</span>'+esc(a.nome)+
     (a.desc?'<div class="base">'+esc(a.desc)+'</div>':'')+(a.del?'<span class="badge">Só Delegado Civil decreta</span>':'')+(isx?'<span class="badge">Seu artigo</span>':'')+'</div>'+
     '<div class="row" style="flex-direction:column;align-items:stretch">'+
     '<button class="btn sm'+(on?'':' ghost')+'" data-sel="'+a.id+'" aria-pressed="'+on+'">'+(on?'Somado':'Somar')+'</button>'+
     (isx?(S.del===a.id?'<button class="btn danger sm" data-delok="'+a.id+'">Apagar?</button>':'<button class="btn ghost sm" data-del="'+a.id+'">Apagar</button>'):'')+
     '</div></div></div>';
  });
  if(!any)h+='<div class="empty">Nenhum artigo encontrado.</div>';
  h+='</div><h2 class="sec" style="margin-top:18px">Adicionar artigo seu</h2><div class="note" style="margin-bottom:8px">Para artigos novos que o servidor criar depois deste PDF.</div>'+
   '<form class="f" id="fa"><div class="two"><div class="field"><label class="lbl" for="a1">Artigo</label><input id="a1" placeholder="Art. 52º" required></div>'+
   '<div class="field"><label class="lbl" for="a2">Crime</label><input id="a2" placeholder="Nome do crime" required></div></div>'+
   '<div class="two"><div class="field"><label class="lbl" for="a3">Pena mínima (anos)</label><input id="a3" type="number" inputmode="numeric" min="0" required></div>'+
   '<div class="field"><label class="lbl" for="a5">Pena máxima (anos)</label><input id="a5" type="number" inputmode="numeric" min="0" required></div></div>'+
   '<div class="field"><label class="lbl" for="a4">Observação</label><input id="a4" placeholder="Quando se aplica"></div>'+
   '<button class="btn" type="submit">Salvar artigo</button></form>'+
   '<div class="src">Fonte: Código Penal das Regras LEGACY RP (PDF de 01/08/2026). Penas em anos de reclusão, como no código.</div>';
  return h;
}

  renderPill();
}
function setTab(t){S.tab=t;S.q='';S.resetAsk=false;S.del=null;save('rp_tab',t);render();window.scrollTo(0,0)}

/* ---------- Eventos ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  var d=b.dataset;
  if(b.id==='pill'){window.scrollTo(0,0);return}
  if(d.tab)return setTab(d.tab);
  if(d.cat){S.cat=d.cat;return render()}
  if(d.copy!==undefined)return copy(REPLICAS[+d.copy].resp);
  if(d.reset){
    if(d.reset==='yes'){S.checks={};save('rp_checks',S.checks);S.resetAsk=false;toast('Checklist limpo')}else S.resetAsk=d.reset==='ask';
    return render()}
  if(d.sel){if(S.sel[d.sel])delete S.sel[d.sel];else S.sel[d.sel]=1;save('rp_sel',S.sel);return render()}
  if(d.selrm){delete S.sel[d.selrm];save('rp_sel',S.sel);return render()}
  if(d.selclear){S.sel={};save('rp_sel',S.sel);return render()}
  if(d.toreport){S.rel.artigos=relArtigos();save('rp_rel',S.rel);toast('Artigos no relatório');return setTab('relatorio')}
  if(d.del){S.del=d.del;return render()}
  if(d.delok){S.extra=S.extra.filter(function(x){return x.id!==d.delok});delete S.sel[d.delok];save('rp_extra',S.extra);save('rp_sel',S.sel);S.del=null;toast('Artigo apagado');return render()}
  if(d.copyrel)return copy(relText());
  if(d.relreset){
    if(d.relreset==='yes'){S.rel={policial:'Nascimento Bepi'};save('rp_rel',S.rel);S.resetAsk=false;toast('Relatório limpo')}else S.resetAsk=d.relreset==='ask';
    return render()}
});
document.addEventListener('toggle',function(e){var d=e.target;if(d.dataset&&d.dataset.i!==undefined)S.open[d.dataset.i]=d.open},true);
document.addEventListener('change',function(e){
  var c=e.target.dataset&&e.target.dataset.ck;
  if(c){S.checks[c]=e.target.checked;save('rp_checks',S.checks);render()}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'||t.id==='qa'){S.q=t.value;var pos=t.selectionStart;render();var n=$('#'+t.id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}return}
  if(t.dataset&&t.dataset.r){S.rel[t.dataset.r]=t.value;save('rp_rel',S.rel);var o=$('#out');if(o)o.textContent=relText()}
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  if(e.target.id==='fa'){
    var mn=Math.max(0,parseInt($('#a3').value,10)||0),mx=Math.max(mn,parseInt($('#a5').value,10)||0);
    S.extra.push({id:'x'+Date.now(),art:$('#a1').value.trim(),nome:$('#a2').value.trim(),min:mn,max:mx,desc:$('#a4').value.trim()});
    save('rp_extra',S.extra);toast('Artigo salvo');render()}
});
render();
})();
</script>

</body></html>
